name: Titre de PR

# Les PR sont mergées en squash : leur titre devient le message de commit sur main, que le workflow
# Release lit pour choisir la prochaine version (feat = mineure, fix = correctif, ! = majeure).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Titre au format Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            test
            refactor
            style
            build
            ci
            chore
