name: Release

# Releases GitHub selon SemVer, pilotées par release-please à partir des messages Conventional Commits :
# 1. chaque push sur main met à jour une PR « chore: release X.Y.Z » (CHANGELOG.md, version.txt) ;
# 2. merger cette PR crée le tag vX.Y.Z et la release GitHub avec ses notes ;
# 3. le job « apk » compile l'APK release, le signe et l'attache à la release.
on:
  push:
    branches: [main]

# Deux pushes rapprochés ne doivent pas créer deux fois la même release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Préparer la release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Pour relancer la CI sur la PR de release (voir plus bas).
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Une PR ouverte avec le jeton du workflow ne déclenche pas la CI (règle GitHub contre les boucles),
      # alors que main exige ci-ok : on la lance explicitement, ce qui reste permis avec ce jeton.
      - name: Lancer la CI sur la PR de release
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  apk:
    name: APK de la release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      # Toutes les releases doivent être signées avec la même clé, sinon Android refuse la mise à jour.
      # Sans secret, l'APK est signé avec une clé debug jetable : installable, mais pas comme mise à jour.
      - name: Clé de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 absent : APK signé avec une clé debug (voir CONTRIBUTING.md)."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compiler l'APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Vérifier la version de l'APK
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          version="$("$aapt" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "versionName de l'APK : $version, tag : $TAG"
          [ "v$version" = "$TAG" ]
      - name: Attacher l'APK à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="alwaysclock-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
