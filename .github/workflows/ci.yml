name: CI

# Une PR ne peut être mergée que si le job « ci-ok » est vert (règle de protection de main).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ktlint, detekt, Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt lintDebug
      - name: Afficher tous les problèmes Android Lint
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/

  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  instrumented-tests:
    name: Tests d'interface (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache de l'émulateur
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}
      - name: Créer l'émulateur (une seule fois, puis en cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Émulateur créé et mis en cache."
      - name: Tests Compose sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/

  build:
    name: APK debug et release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      # La variante release est celle publiée par release.yml : elle doit compiler sur chaque PR.
      - run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: alwaysclock-debug
          path: app/build/outputs/apk/debug/*.apk

  # Point de contrôle unique exigé par la protection de main : vert seulement si tous les autres jobs le sont.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit-tests, instrumented-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs sont verts
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
