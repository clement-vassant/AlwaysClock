version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Titres Conventional Commits : les mises à jour de bibliothèques apparaissent dans les notes de version.
    commit-message:
      prefix: deps
    groups:
      # Les bibliothèques Compose/AndroidX et Kotlin évoluent ensemble : une seule PR par semaine.
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Les actions GitHub ne changent pas l'app : pas de release pour elles.
    commit-message:
      prefix: ci
