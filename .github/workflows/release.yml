name: Release

# Publication d'une release GitHub à la demande, depuis Actions > Release > Run workflow :
# calcule la prochaine version SemVer depuis le dernier tag vX.Y.Z et les messages Conventional Commits,
# compile l'APK release signé, puis crée le tag et la release GitHub (notes groupées par rubrique) avec l'APK.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Saut de version (auto : déduit des commits depuis la dernière release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Deux clics rapprochés ne doivent pas publier deux fois la même version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Seul main est protégé par ci-ok : on ne publie rien d'autre.
      - name: Vérifier la branche
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Une release se lance depuis main, pas depuis $GITHUB_REF_NAME."
          exit 1
      - uses: actions/checkout@v4
        with:
          # Tout l'historique et les tags, pour trouver la dernière release.
          fetch-depth: 0
      - name: Calculer la version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$last_tag" ]; then
            version=0.1.0
          else
            log="$(git log "$last_tag..HEAD" --format='%s%n%b')"
            if [ -z "$log" ]; then
              echo "::error::Aucun commit depuis $last_tag : rien à publier."
              exit 1
            fi
            version="$(scripts/next-version.sh "${last_tag#v}" "$BUMP" <<<"$log")"
          fi
          echo "Dernière release : ${last_tag:-aucune}, nouvelle version : $version"
          echo "LAST_TAG=$last_tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v4
      # Toutes les releases doivent être signées avec la même clé, sinon Android refuse la mise à jour.
      # Sans secret, l'APK est signé avec une clé debug jetable : installable, mais pas comme mise à jour.
      - name: Clé de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 absent : APK signé avec une clé debug (voir CONTRIBUTING.md)."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compiler l'APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersion="$VERSION"
      - name: Vérifier la version de l'APK
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          apk_version="$("$aapt" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "versionName de l'APK : $apk_version"
          [ "$apk_version" = "$VERSION" ]
      - name: Écrire les notes de version
        run: |
          range="${LAST_TAG:+$LAST_TAG..}HEAD"
          git log "$range" --format=%s | scripts/release-notes.sh "$GITHUB_REPOSITORY" "$LAST_TAG" "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="alwaysclock-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "AlwaysClock $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
